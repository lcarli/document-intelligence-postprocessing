[project]
name = "document-intelligence-postprocessing"
version = "0.1.0"
description = "Extensible, auditable post-processing for Azure AI Document Intelligence"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".test-packages", ".python_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = ["postprocessing", "function_app.py"]

[[tool.mypy.overrides]]
module = ["azure.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
